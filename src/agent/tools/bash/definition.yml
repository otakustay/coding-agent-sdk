name: bash

description: |-
  Executes a given terminal command in an instant shell session, ensuring proper handling and security measures.

  IMPORTANT: This tool is for terminal operations like git, npm, docker, etc. DO NOT use it for file operations (reading, writing, editing, searching, finding files and deleting files) - use the specialized tools for this instead.

  Before executing the command, please follow these steps:

  1. Directory Verification:
     - If the command will create new directories or files, first use `ls` to verify the parent directory exists and is the correct location
     - For example, before running "mkdir foo/bar", first use `ls foo` to check that "foo" exists and is the intended parent directory

  2. Command Execution:
     - Always quote file paths that contain spaces with double quotes (e.g., cd "path with spaces/file.txt")
     - After ensuring proper quoting, execute the command.
     - Capture the output of the command.

  Usage notes:
    - The command argument is required.
    - If the output exceeds 30000 characters, output will be truncated before being returned to you.
    - Avoid using bash with the `find`, `grep`, `cat`, `head`, `tail`, `sed`, `awk`, or `echo` commands, unless explicitly instructed or when these commands are truly necessary for the task. Instead, always prefer using the dedicated tools for these commands.
    - When issuing multiple commands:
      - If the commands are independent and can run in parallel, make multiple bash tool calls in a single message.
      - If the commands depend on each other and must run sequentially, use a single bash call with '&&' to chain them together.

  Background execution (background: true):
    - The command runs asynchronously; the tool returns immediately with a task ID (e.g. bash_12345).
    - Use the `taskOutput` tool with the returned task ID to read output and check process status at any time.
    - Use background mode for long-running processes like dev servers, build watchers, or any command that does not terminate quickly.
    - IMPORTANT: To stop a background task, ALWAYS use the `taskStop` tool with the task ID. NEVER use shell commands like `kill`, `pkill`, or `killall` — they bypass task tracking and will leave the task in an inconsistent state.

parameters:
  type: object
  properties:
    description:
      type: string
      description: |-
        Clear, concise description of what this command does in 5-10 words. Examples:

        Input: ls
        Output: Lists files in current directory

        Input: git status
        Output: Shows working tree status

        Input: npm install
        Output: Installs package dependencies

        Input: mkdir foo
        Output: Creates directory 'foo'
    command:
      type: string
      description: |-
        The shell command to execute from the user's current workspace. The command may include chaining and directory changes. Must be non-interactive and complete without user input. Must use valid syntax for the user's shell
    background:
      type: boolean
      description: |-
        When true, the command runs in the background without blocking. The tool returns immediately with a task ID. Use the `taskOutput` tool with that task ID to read the output at any time. Use this for long-running commands (e.g., servers, builds, watchers).
  required:
    - description
    - command
