name: list

description: |-
  Lists files and directories in a given path.
  The result does not display dot-files and dot-directories.

parameters:
  type: object
  properties:
    target_directory:
      type: string
      description: Path to directory to list contents of.
    ignore_globs:
      type: array
      items:
        type: string
      description: Optional array of glob patterns to ignore.
    depth:
      type: number
      description: Max depth of given path.
  required:
    - target_directory
