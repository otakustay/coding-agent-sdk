name: taskOutput

description: |-
  Reads the output of a background process started with the bash or agent tool.
  Returns the process status and output lines.
  Supports pagination via offset and limit parameters.

parameters:
  type: object
  properties:
    task_id:
      type: string
      description: The task ID of the background process to read output from (e.g. bash_12345 or agent_abc123).
    offset:
      type: number
      description: |-
        The line number to start reading from (1-based).
        Negative values count from the end of the output (e.g. -10 starts from the 10th-to-last line).
        Omit to start from the beginning.
    limit:
      type: number
      description: The number of lines to read. Omit to read all available lines from the offset.
  required:
    - task_id
